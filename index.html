<!DOCTYPE html>
<html>
<head>
    <title>OTP Integration</title>
    <style>
        #otpFrame {
            width: 400px;
            height: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<button onclick="openIframe()">Start OTP</button>

<div id="iframeContainer" style="display:none;">
    <iframe
        id="otpFrame"
        src="https://internetbanking.dev.ibmb.equitasbank.com/otp"
    ></iframe>
</div>

<script>

function openIframe(){
    document.getElementById("iframeContainer").style.display = "block";
}


// 🔥 LISTEN FOR CHILD MESSAGE
window.addEventListener("message", function(event){

    // ✅ STEP 1 — ALWAYS VALIDATE ORIGIN
    const trustedOrigin = "https://internetbanking.dev.ibmb.equitasbank.com";

    if(event.origin !== trustedOrigin){
        console.warn("Blocked message from untrusted origin:", event.origin);
        return;
    }

    const data = event.data;

    // ✅ STEP 2 — Validate message structure
    if(data?.type === "OTP_RESULT"){

        console.log("OTP Response:", data);

        if(data?.payload?.success){

            const checkVal = data?.payload?.checkVal;

            console.log("Received checkVal:", checkVal);

            // ⭐ CLOSE IFRAME
            document.getElementById("iframeContainer").style.display = "none";

            // ⭐ CALL YOUR BACKEND (Recommended)
            verifyOtpWithServer(checkVal);
        }
        else{
            alert("OTP Failed. Try again.");
        }
    }

});


// ⭐ Example backend verification
function verifyOtpWithServer(checkVal){

    fetch("/api/verify-otp",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({checkVal})
    })
    .then(res => res.json())
    .then(data=>{
        console.log("Server verification:", data);
    })
}

</script>

</body>
</html>
